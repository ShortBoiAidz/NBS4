<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="keywords"
      content="Minecraft, Server, Homepage, NoodleBox, Season 3, NBS3"
    />
    <meta name="author" content="ShortBoiAidz, Aiden Thorpe" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="copyright"
      content="Copyright 2026 Aiden Thorpe. All rights reserved."
    />

    <title>NoodleBox SMP | Admin Panel</title>

    <link rel="icon" type="image/x-icon" href="/images/noodleboxLogo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/animations.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
    <link rel="stylesheet" href="styles/other.css" />
    <link rel="stylesheet" href="styles/admin.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="scripts/loader.js"></script>
    <script src="scripts/webhook.js"></script>
    <script src="scripts/admin.js"></script>

    <link rel="canonical" href="https://noodlebox.cc" />
  </head>

  <body>
    <!-- Loading Screen -->
    <div class="loading-screen">
      <div class="loading">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="homepageContainer">

      <!-- LOGIN -->
      <div class="content adminContent" id="loginForm">
        <img
            src="images/noodleboxLogo.png"
            alt="NoodleBox Logo"
            class="logo adminLogo"
          />
        <div class="mainCardParent">
          <div class="homeCard adminCard">
            <h1 class="gradient-text">ADMIN PANEL</h1>
            <sub id="incorrectID">Fuck off</sub>
            <form class="formBox">
              <input type="password" name="password" id="password" placeholder="Enter user ID">
              <button onclick="adminLogin()" class="loginButton" type="button">
                <h2>Log In</h2>
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- ADMIN ONLY -->
      <main id="adminOnly">
        <div class="content">
          <img
            src="images/noodleboxLogoWeb.png"
            alt="NoodleBox Logo"
            class="logo"
          />
          <div class="mainCardParent adminCardParent">
            <div class="homeCard">
              <h1 class="gradient-text">ADMIN PANEL</h1>

              <br />

              <sub class="gradient-text">Admin Only</sub>
            </div>
          </div>

          <div class="flexRow">
            <div class="h2CardParent">
              <h2 class="gradient-text webhookTitle">Webhook Sender</h2>
              <a href="scripts/webhooks.json" target="_blank"><sub class="webhookList">List of webhooks</sub></a>
              <input type="url" name="webhook" id="webhookLink" placeholder="Webhook Link">
              <textarea id="message" placeholder="Enter message"></textarea>
              <button onclick="message()" class="messageButton" type="button">
                <h2>Send message</h2>
              </button>
            </div>

            <div class="h2CardParent gradFlipX">
              <h2 class="gradient-text webhookTitle">Website Updater</h2>
              <textarea id="heading" placeholder="Enter version"></textarea>
              <textarea id="subheading" placeholder="Enter feature"></textarea>
              <textarea id="messageContent" placeholder="Enter content"></textarea>
              <button onclick="websiteUpdate()" class="messageButton" type="button">
                <h2>Send message</h2>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
