<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      content="Minecraft, Server, Homepage, NoodleBox, Season 4, NBS4, SMP"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="copyright"
      content="Copyright 2026 Aiden Thorpe, SunnySomething. All rights reserved."
    />
    <meta
      name="description"
      content="Find information about the NoodleBox SMP!"
    />

    <title>NoodleBox SMP | Homepage</title>

    <link rel="icon" type="image/x-icon" href="/images/noodleboxLogo_noBG.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/animations.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
    <link rel="stylesheet" href="styles/other.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="scripts/loader.js"></script>
    <script src="scripts/ip.js"></script>
    <script src="scripts/themes.js"></script>
    <script src="scripts/ipban.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

    <link rel="canonical" href="https://noodlebox.cc" />
  </head>

  <body>
    <!-- Loading Screen -->
    <div class="loading-screen">
      <div class="loading">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="homepageContainer">
      <nav>
        <ul class="sidebar">
          <i class="fa-regular fa-rectangle-xmark" onclick=closeSidebar()></i>
          <li><a href="index.html" class="navLink"><h4 class="active">Home</h4></a></li>
          <li><a href="players.html" class="navLink"><h4>Players</h4></a></li>
          <li><a onclick=notAvailable() class="navLink"><h4>Societies</h4></a></li>
          <li><a href="gallery.html" class="navLink"><h4>Gallery</h4></a></li>
          <li><a href="roadmap.html" class="navLink"><h4>Roadmap</h4></a></li>
          <li><a href="https://discord.gg/k8M3CMXGmx" class="navLink"><h4>Join Here</h4></a></li>
          <li><a onclick=notAvailable() class="navLink" download><h4>Modrinth File</h4></a></li>
        </ul>

        <ul class="mainNav">
          <h3 class="navHeader gradient-text">Navigation</h3>
          <div class="navDivider"></div>
          <li><a href="index.html" class="gradient-text navLink active availableButton"><h4>Home</h4></a></li>
          <li><a href="players.html" class="gradient-text navLink availableButton"><h4>Players</h4></a></li>
          <li><a onclick=notAvailable() class="gradient-text navLink notAvailableButton"><h4>Societies</h4></a></li>
          <li><a href="gallery.html" class="gradient-text navLink availableButton"><h4>Gallery</h4></a></li>
          <li><a href="roadmap.html" class="gradient-text navLink availableButton"><h4>Roadmap</h4></a></li>
          <li><a href="https://discord.gg/k8M3CMXGmx" class="gradient-text navLink availableButton"><h4>Join Here</h4></a></li>
          <li><a onclick=notAvailable() class="gradient-text navLink notAvailableButton" download><h4>Modrinth File</h4></a></li>
        </ul>
      </nav>
      <i class="fa-solid fa-bars" onclick=openSidebar()></i>

      <i class="fa-regular fa-moon" onclick="toggleDarkMode()" id="themeToggleMoon" title="Toggle Dark Mode"></i>
      <i class="fa-regular fa-sun" onclick="toggleLightMode()" id="themeToggleSun" title="Toggle Light Mode"></i>

      <main>
        <div class="content">
          <img
            src="images/noodleboxLogo.png"
            alt="NoodleBox Logo"
            class="logo"
            id="logo"
            onclick="location.href='https://nsb3-archive.surzies.workers.dev/'"
            title="Take me back to the old times"
          />
          <div class="mainCardParent">
            <div class="homeCard">
              <h1 class="gradient-text">NoodleBox Season 4</h1>

              <br />

              <sub class="gradient-text"
                >Beta test out now!</sub
              >
              <br>
              <h4 class="gradient-text"
                >Current Update: 1.0.0-beta</h4
              >

              <br />

              <div class="buttonCardParent">
                <a href="https://discord.gg/k8M3CMXGmx">
                  <div class="buttonCard availableButton">
                    <i
                      class="fa-brands fa-discord headerIcon"
                      style="cursor: pointer"
                    ></i>
                  </div>
                </a>

                <div class="buttonCard availableButton">
                  <i
                    class="fa-solid fa-envelope headerIcon"
                    onclick="emailClick()"
                    style="cursor: pointer"
                  ></i>
                </div>
              </div>
            </div>
          </div>

          <br />

          <div class="h2CardParent">
            <div class="h2Card">
              <button onclick="location.href = 'players.html'" class="availableButton">
                <h2 class="gradient-text-h2">Players</h2>
                <p class="gradient-text-h2">Meet the players who populate NoodleBox</p>
              </button>

              <button onclick=notAvailable() class="notAvailableButton">
                <h2 class="gradient-text-h2">Societies</h2>
                <p class="gradient-text-h2">NoodleBox is made up of societies. Find out more here</p>
              </button>
            </div>

            <div class="mainCardH2">
              <button onclick="location.href = 'gallery.html'" class="availableButton">
                <h2 class="gradient-text-h2">Gallery</h2>
              </button>

              <button onclick="location.href = 'roadmap.html'" class="availableButton">
                <h2 class="gradient-text-h2">Roadmap</h2>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        toggleDarkMode();
      } else {
        toggleLightMode();
      }
    </script>
  </body>
</html>
